name: Deploy backend to Azure Container Apps
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # lets GitHub get a short-lived Azure token (no stored passwords)
  contents: read

concurrency: { group: deploy-backend, cancel-in-progress: false }

env:
  # Set these 3 as repository *variables* (Settings > Secrets and variables > Actions > Variables)
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build image in Azure Container Registry
        run: az acr build --registry "$ACR_NAME" --image "kasauti-api:${{ github.sha }}" ./backend
      - name: Roll out new revision
        run: |
          az containerapp update \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/kasauti-api:${{ github.sha }}" \
            --set-env-vars GIT_SHA=${{ github.sha }}
      - name: Smoke test
        run: |
          FQDN=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in 1 2 3 4 5 6; do
            curl -fsS "https://$FQDN/health" && exit 0
            sleep 10
          done
          echo "Health check failed" && exit 1
